name: Desktop and Web CI

on:
  push:
  pull_request:
  repository_dispatch:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  desktop:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            gradle: ./gradlew
            artifact: JPSyllabary-linux
            packages: desktop/build/compose/binaries/main-release/deb/*.deb
          - platform: Windows
            os: windows-latest
            gradle: ./gradlew.bat
            artifact: JPSyllabary-windows
            packages: desktop/build/compose/binaries/main-release/exe/*.exe
          - platform: macOS
            os: macos-latest
            gradle: ./gradlew
            artifact: JPSyllabary-macos
            packages: desktop/build/compose/binaries/main-release/dmg/*.dmg

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Package application
        run: ${{ matrix.gradle }} :desktop:packageReleaseDistributionForCurrentOS --stacktrace

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.packages }}
          if-no-files-found: error

  web:
    name: Package Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build web distribution
        run: ./gradlew :shared:wasmJsBrowserDistribution --stacktrace

      - name: Upload web distribution
        uses: actions/upload-artifact@v7
        with:
          name: JPSyllabary-web
          path: shared/build/dist/wasmJs/productionExecutable
          if-no-files-found: error

  ios:
    name: Package iOS XCFramework
    runs-on: macos-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build iOS XCFramework
        run: ./gradlew :shared:assembleSharedReleaseXCFramework --stacktrace

      - name: Upload iOS XCFramework
        uses: actions/upload-artifact@v7
        with:
          name: JPSyllabary-ios
          path: shared/build/XCFrameworks/release/Shared.xcframework
          if-no-files-found: error
